name: Update trailer index

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: trailer-feed
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update index
        env:
          IPTV_SERVER: ${{ secrets.IPTV_SERVER }}
          IPTV_USERNAME: ${{ secrets.IPTV_USERNAME }}
          IPTV_PASSWORD: ${{ secrets.IPTV_PASSWORD }}
          TMDB_BEARER: ${{ secrets.TMDB_BEARER }}
        run: python update_trailers.py
      - name: Save index for next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/trailers.json state/trailer-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public trailer index"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
